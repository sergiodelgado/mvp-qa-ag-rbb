name: CI – API F3b (Newman + HTML report)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-api-f3b:
    runs-on: ubuntu-latest

    env:
      # Necesarios para Next.js (backend /api/sugerencias)
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app (modo producción)
        run: npm run build

      - name: Start app
        run: npm start &

      - name: Esperar a que la API responda
        run: |
          echo "Esperando a que http://localhost:3000/api/sugerencias esté disponible..."
          for i in {1..15}; do
            if curl -sSf http://localhost:3000/api/sugerencias > /dev/null; then
              echo "API OK"
              exit 0
            fi
            echo "Intento $i/15: API aún no responde, esperando 2s..."
            sleep 2
          done
          echo "La API no respondió a tiempo"
          exit 1

      - name: Ejecutar suite F3b con Newman (HTML report)
        run: |
          mkdir -p newman
          npx newman run ./postman/mvp-ag-rbb-buzon.postman_collection.json \
            -e ./postman/mvp-ag-rbb-local.postman_environment.json \
            --env-var "SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --env-var "SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --env-var "TEST_EMAIL_A=${{ secrets.TEST_EMAIL_A }}" \
            --env-var "TEST_PASSWORD_A=${{ secrets.TEST_PASSWORD_A }}" \
            --env-var "TEST_EMAIL_B=${{ secrets.TEST_EMAIL_B }}" \
            --env-var "TEST_PASSWORD_B=${{ secrets.TEST_PASSWORD_B }}" \
            --reporters cli,html \
            --reporter-html-export newman/report-f3b.html \
            --timeout-request 15000 \
            --delay-request 200

      - name: Publicar reporte HTML de Newman
        uses: actions/upload-artifact@v4
        with:
          name: newman-report-f3b
          path: newman/report-f3b.html
